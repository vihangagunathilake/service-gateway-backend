spring.application.name=service-gateway-backend
server.port=8686

server.servlet.context-path=/service-gateway

spring.datasource.url=jdbc:mysql://localhost:3306/service_gateway?autoReconnect=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database=MYSQL
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.hibernate.ddl-auto=update

logging.config=classpath:logback.xml

# Location to store uploaded images.
# C:/Users/Acer/Desktop/Work/My/04. Task Tracker/task-tracker/images
# In /images - 'python -m http.server 8282' - http://localhost:8282/user/profile
app.image.url=${APP_IMAGE_URL}
user.images.storage.path=${USERS_IMAGE_STORAGE}

cors.allowed.origins=${CORS_ALLOWED_ORIGINS}