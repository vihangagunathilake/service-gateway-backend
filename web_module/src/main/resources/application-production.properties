spring.application.name=service-gateway-backend

server.servlet.context-path=/service-gateway

spring.datasource.url=jdbc:mysql://localhost:3306/service_gateway?autoReconnect=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database=MYSQL
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.hibernate.ddl-auto=update

logging.config=classpath:logback.xml

app.frontend.url=${APP_FRONTEND_URL}

app.image.url=${APP_IMAGE_URL}
app.storage.path=${APP_STORAGE_PATH}
user.profile=${USER_PROFILE}
user.cover=${USER_COVER}
provider.profile=${PROVIDER_PROFILE}
provider.cover=${PROVIDER_COVER}

cors.allowed.origins=${CORS_ALLOWED_ORIGINS}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
